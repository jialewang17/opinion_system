relevance:
  template: |
    我现在正在筛选控烟相关的舆情信息，关于公共场合吸烟、控烟形象等，一些与烟草售卖、没有体现控烟的数据都剔除
    为我判断下面的信息是关于控烟的吗，仅给出布尔值即可，json格式返回：
    {"相关": true/false}。
    文本：{text}

  truncation:
    max_tokens: 200

highlights:
  template_1: |
    请分析以下舆情文本，提取其中的主要议题，议题格式以新闻事件方式，尽量不要出现重复。

    重要：你必须严格按照以下JSON格式返回，不要添加任何其他文字：
    {{
      "highlights": [
        "议题1",
        "议题2",
        "议题3"
      ]
    }}

    要求：
    1. 提取20条主要舆论议题
    2. 必须返回完整有效的JSON格式，不要添加任何解释文字
    3. 不要使用Markdown格式，直接返回纯JSON
    
    文本：{text}

  truncation:
    max_tokens: 40000

  template_2: |
    我现在有一些舆情分析的json结果，包含舆情文本的一些核心议题，请为我在其中再次进行衡量比较，提取出20条主要舆论议题，议题格式以新闻事件方式，尽量不要出现重复比如"鲁迅吸烟墙引争议""国家新型控烟管控"等等
    
    请严格按照以下JSON格式返回：
    {{
      "highlights": [
        "议题1",
        "议题2",
        "议题3"
      ]
    }}
    文本：{text}

explain:
  volume: |
    项目背景：当前项目为控烟舆情分析系统，主要监测和分析与控烟相关的舆情信息，包括公共场合吸烟、控烟形象、控烟政策等话题。

    请基于以下声量分析数据，撰写专业的控烟舆情声量分析报告。

    请严格按照以下格式生成专业的控烟舆情声量分析报告：

    ## 数据概览
    简要概述声量分析数据的核心指标和主要发现

    ## 深度分析
    根据数据内容进行专业的舆情分析，包括：
    - 各渠道的声量分布特点和原因分析
    - 声量最高的渠道及其影响力分析
    - 声量分布对控烟舆情传播的影响分析
    - 声量变化趋势及其影响因素

    ## 专业洞察
    基于数据提供专业的舆情洞察和建议

    ## 结论与建议
    总结核心发现，提出针对性的建议

    要求：
    1. 语言专业、分析深入，符合舆情分析报告标准
    2. 每个部分都要有具体的数据支撑
    3. 分析要有逻辑性和连贯性
    4. 报告结构清晰，段落分明
    5. 字数不少于800字
    6. 根据数据内容适当联网搜索，补充相关控烟政策、事件背景等信息，增强报告的权威性和时效性
    7. 分析时请排除"未知"选项，不将其纳入分析范围
    
    数据：{json}

