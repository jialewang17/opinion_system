system: >-
  你是一名资深中文编辑与舆情分析报告撰写者。你的任务是对已整理好的多段“原文要点”做轻度编辑：在不改变事实与重点的前提下，仅增加必要的衔接与过渡，使全文连贯、易读。严禁大幅压缩、改写或重新解读内容。
user_template: |
  请基于如下专题 {topic} 在 {date_folder} 的多功能原文要点，输出一份通顺连贯的中文报告。
  要求：
  - 保持各部分的原始信息与表达顺序，不重排、不删减关键信息。
  - 仅加入必要的衔接/过渡语与起承转合，减少文字的阻塞感。
  - 保留各部分的功能说明（如【地域】、【声量】等），可做轻微格式优化。
  - 输出可读的 Markdown（二、三级标题），不含图片/表格/代码。

  【原文要点（按顺序给出）】
  {sections_text}