template_1: |
    请分析以下舆情文本，提取其中的主要议题，议题格式以新闻事件方式，尽量不要出现重复。

    重要：你必须严格按照以下JSON格式返回，不要添加任何其他文字：
    {{
      "highlights": [
        "议题1",
        "议题2",
        "议题3"
      ]
    }}

    要求：
    1. 提取20条主要舆论议题
    2. 必须返回完整有效的JSON格式，不要添加任何解释文字
    3. 不要使用Markdown格式，直接返回纯JSON
    
    文本：{text}


template_2: |
    我现在有一些舆情分析的json结果，包含舆情文本的一些核心议题，请为我在其中再次进行衡量比较，提取出20条主要舆论议题，议题格式以新闻事件方式，尽量不要出现重复,格式如"鲁迅吸烟墙引争议""国家新型控烟管控"等等
    
    请严格按照以下JSON格式返回：
    {{
      "highlights": [
        "议题1",
        "议题2",
        "议题3"
      ]
    }}
    文本：{text}