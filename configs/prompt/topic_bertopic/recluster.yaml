# BERTopic大模型再聚类提示词配置
prompts:
  topic_bertopic_recluster:
    system: |
      你是一个专业的控烟领域主题分析专家，擅长将相似的控烟相关主题进行归纳和合并，并对其进行命名。
    user: |
      分析以下控烟相关主题，将语义相似的主题合并为{TARGET_TOPICS}个左右的主题。

      【控烟研究框架维度】(参考)
      1.烟草与健康相关议题：疾病关联、病理机制、流行病学、戒烟效益
      2.无烟立法相关议题：法律制定、法规修订、实施情况
      3.控烟公约相关议题：FCTC进程、履约评估、国际协商、执行情况
      4.无烟场所相关议题：公共场所禁烟、禁烟范围、吸烟区设置、执法效果
      5.监管体制与处罚相关议题：执法机构、职责划分、监督机制、违法处罚
      6.包装警示相关议题：健康警示、图形标识、包装轮换、禁止误导性标签
      7.税收价格相关议题：税费政策、价格调控、最低定价、非法贸易影响
      8.影视作品及广告相关议题：广告限制、影视控烟、广告植入、间接促销
      9.公共议题、抗争性议题与公共事件相关议题：社会运动、公众抗议、重大事件、舆论讨论
      10.公共卫生（PM2.5等）相关议题：二手烟与PM2.5、环境污染、健康中国战略
      11.文化价值相关议题：社会文化、习俗反思（敬烟）、礼品文化、无烟风尚
      12.青少年相关议题：禁止向青少年售烟、校园周边监管、吸烟率调查、流行与干预
      13.港澳台及国际经验相关议题：港澳台经验、国际经验、政策比较、立法实践
      14.电子烟相关议题：新型烟草监管、健康风险、口味禁令、税收政策
      输入数据：
      {input_data}

      任务要求：
      1. 将语义相似的主题合并
      2. 合并后主题数控制在{TARGET_TOPICS}个左右（±2个）
      3. 保持主题间区分度
      4. 为每个合并后的主题生成一个符合控烟研究框架、完整、精准、具有学术概括性的中文主题名称（6-8个字，必须包含完整的语义结构）

      【合并原则】
      1. 内容相似：关键词重叠度高
      2. 框架一致：属于同一研究维度
      3. 避免过度合并：差异明显的主题保持独立
      4. 主题命名：基于主题描述，提炼核心概念，符合控烟研究框架

      【主题命名要求】
      - 名称长度为 6-8个字，确保完整性和描述性
      - 符合控烟研究框架，具有学术概括性
      - 基于主题描述提炼核心概念
      - 命名必须包含完整的语义结构，不能只是单一词汇
        * 正确示例："青少年烟草防护"、"烟草税政监管"、"公共场所控烟执法"、"戒烟干预方法"
        * 错误示例："青少年"、"烟草"、"执法"、"干预"（过于简洁）

      输出格式（JSON）：
      {{
        "合并方案": [
          {{
            "新主题名称": "新主题0",
            "原始主题集合": ["主题3", "主题5", "主题9"],
            "主题描述": "这个主题主要关注...",
            "主题命名": "完整的主题中文名称（6-8个字，必须包含完整的语义结构）",
            "合并理由": "这些主题都涉及...",
            "合并后关键词": ["关键词1", "关键词2", "关键词3", "关键词4", "关键词5", "关键词6", "关键词7", "关键词8", "关键词9", "关键词10"]
          }}
        ],
        "分析说明": "整体聚类策略说明"
      }}

      请直接输出JSON，不要其他内容。



