# ============================================================================
# RAG检索系统提示词配置文件
# 用途：集中管理所有LLM提示词，便于调整和维护
# ============================================================================

# 时间提取提示词
time_extraction:
  prompt: |
    请分析以下查询语句，判断是否包含时间信息，并以JSON格式返回。

    查询语句：{query}

    请返回JSON格式：
    {{
        "has_time": true/false,
        "time_text": "提取的时间文本（如果有）"
    }}

    示例：
    - "2024年控烟政策" → {{"has_time": true, "time_text": "2024年"}}
    - "第三季度报告" → {{"has_time": true, "time_text": "第三季度"}}
    - "鲁迅的影响" → {{"has_time": false, "time_text": ""}}

    只返回JSON，不要其他文字。

# 时间匹配提示词
time_matching:
  prompt: |
    请判断查询的时间范围与哪些文档的时间范围相关。

    查询时间：{query_time}

    文档时间范围：
    {doc_time_list}

    请返回JSON格式（matched_doc_ids中只填写ID数字，不要加"文档"等前缀）：
    {{
        "matched_doc_ids": ["1", "2"]
    }}

    匹配规则：
    - 年份匹配：查询"2024年" 匹配 "2024年第三季度"
    - 季度匹配：查询"第三季度" 匹配 "2024年第三季度"  
    - 月份匹配：查询"9月" 匹配 "2024年9月22日"
    - 如果查询时间与某文档时间有交集或包含关系，则匹配

    示例：
    - 查询"2024年"，文档"ID=1: 2024年9月", "ID=2: 2025年1月" → {{"matched_doc_ids": ["1"]}}
    - 查询"第三季度"，文档"ID=1: 2024年第三季度" → {{"matched_doc_ids": ["1"]}}

    只返回JSON格式的ID数字，不要其他文字。

# 结果整理提示词 - 严格模式（只根据检索资料）
result_summary_strict:
  prompt: |
    请根据以下检索到的资料，回答用户的问题，并整理成结构化的资料报告。

    用户问题：{query}

    检索到的资料：
    {context}

    请按以下格式整理资料：

    1. 核心要点（3-5条）
       - 要点1
       - 要点2
       ...

    2. 详细说明
       （基于检索资料的详细阐述）

    3. 数据来源
       （说明信息来源）

    **严格要求：**
    - 【重要】只能使用检索到的资料中的信息，严禁添加任何外部知识或推测
    - 如果资料不足以完整回答问题，明确说明哪些方面资料不足
    - 每个要点必须能在上述检索资料中找到明确依据
    - 不要进行任何扩展、联想或补充说明
    - 结构清晰，逻辑连贯，突出重点

    请开始整理：

# 结果整理提示词 - 补充模式（可结合外部知识）
result_summary_supplement:
  prompt: |
    请根据以下检索到的资料，结合你的知识，回答用户的问题，并整理成结构化的资料报告。

    用户问题：{query}

    检索到的资料：
    {context}

    请按以下格式整理资料：

    1. 核心要点（3-5条）
       - 要点1
       - 要点2
       ...

    2. 详细说明
       （基于检索资料，可适当补充相关背景知识）

    3. 补充信息（如果适用）
       （基于你的知识库，补充相关的背景、趋势、影响等信息）

    4. 数据来源
       - 检索资料来源
       - 补充信息来源（标注为"知识库补充"）

    **要求：**
    - 优先使用检索到的资料
    - 可以补充相关背景知识、行业趋势、延伸信息等
    - 明确区分哪些是检索资料，哪些是补充信息
    - 补充内容要与检索资料相关且有价值
    - 结构清晰，逻辑连贯，突出重点

    请开始整理：

