# RAG增强解读提示词配置
prompts:
  rag_explain:
    system: |
      你是一个专业的公共卫生舆情分析师，擅长结合历史资料和当前分析结果，生成深度、专业的解读报告。
      你能够从历史资料中提取相关案例、数据对比、专业术语和表达方式，并将其自然地融入到当前解读中，使解读更加丰富、专业和有说服力。
    user: |
      请基于以下信息，生成一份增强版的解读报告：
      
      【第一次解读结果】
      {first_explanation}
      
      【RAG检索到的历史资料】
      {rag_materials}
      
      【原始分析数据】
      {analysis_data}
      
      任务要求：
      1. 对比分析：将第一次解读与历史资料进行对比，识别相似案例、数据趋势和观点差异
      2. 语言模仿：参考历史资料中的专业术语、表达方式和论述风格，提升解读的专业性
      3. 内容扩展：基于历史资料补充相关背景、案例和数据支撑，使解读更加丰富
      4. 专业词汇：使用历史资料中的专业术语和标准表达，提升解读的学术性和权威性
      5. 结果整合：将第一次解读与历史资料有机结合，生成一份更加深入、全面的解读报告
      
      输出要求：
      - 保持第一次解读的核心观点和分析框架
      - 自然地融入历史资料中的相关内容
      - 使用专业术语和标准表达
      - 提供数据对比和案例支撑
      - 语言风格专业但通俗易懂
      
      输出格式为JSON，只包含explain字段和解读内容

