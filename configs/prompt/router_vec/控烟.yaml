# 实体提取提示词模板
entity_extraction_prompt: |
  你是一个专业的实体识别专家，擅长从文本中提取关键信息。请从以下文本中提取所有重要的实体信息。

  文本内容：
  {text}

  请提取文本中的所有实体，实体类型定义如下：

  1. 人物（PER）：自然人，包括真实姓名、职业身份、角色称谓等。
     示例：张三、李教授、市民、专家、游客、投诉人

  2. 组织机构（ORG）：法人单位、政府部门、企业、团体、机构等组织实体。
     示例：教育部、某某公司、纪念馆、委员会、协会

  3. 地点（LOC）：地理位置、场所、空间区域，包括国家、城市、建筑、自然地理等。
     示例：北京、学校、景区、公共场所、长江、会议室

  4. 事件（EVENT）：已发生或正在发生的具体事件、活动、行为。
     示例：投诉事件、发布会、调查、改革、政策实施

  5. 概念（CONCEPT）：抽象概念、理论、观点、思想、价值观等非实体事物。
     示例：文化传承、公共健康、舆论导向、创新精神

  6. 产品（PRODUCT）：物质产品、作品、服务、工具等人造物品。
     示例：手机、书籍、软件、展览品、墙画、文创产品

  7. 法规政策（POLICY）：法律法规、政策文件、标准规范、管理制度等。
     示例：控烟条例、管理办法、指导意见、行业标准

  8. 话题（TOPIC）：公众讨论的焦点、议题、热点、舆情主题。
     示例：#某某事件#、热搜话题、争议焦点、讨论主题

  对于每个实体，请提供：
  1. entity_name: 实体名称（简洁准确，直接从文本中提取）
  2. type: 实体类型（从上述8种类型中选择：PER/ORG/LOC/EVENT/CONCEPT/PRODUCT/POLICY/TOPIC）
  3. description: 实体在文本中的描述（基于原文，保持客观，说明该实体在文本中的作用或特征）

  请以JSON数组格式返回，每个实体一个对象。格式如下：
  [
      {{
          "entity_name": "实体名称",
          "type": "实体类型代码",
          "description": "实体描述"
      }}
  ]

  注意事项：
  1. 只提取文本中明确出现的实体
  2. 实体名称要准确，不要改写
  3. type必须从上述8种类型中选择
  4. 只返回JSON数组，不要包含任何其他说明文字

# 关系提取提示词模板
relation_extraction_prompt: |
  你是一个专业的关系抽取专家，擅长识别实体之间的语义关联。基于以下文本和已识别的实体，请提取实体之间的关系。

  文本内容：
  {text}

  已识别的实体：
  {entities}

  对于每个关系，请提供：
  1. source: 源实体名称（必须是已识别实体列表中的entity_name）
  2. target: 目标实体名称（必须是已识别实体列表中的entity_name）
  3. relation_type: 关系类型（从上述关系类型中选择最合适的）
  4. description: 关系描述（基于原文，说明两个实体之间的具体关系，保持客观）

  请以JSON数组格式返回，每个关系一个对象。格式如下：
  [
      {{
          "source": "源实体名称",
          "target": "目标实体名称",
          "relation_type": "关系类型",
          "description": "关系描述"
      }}
  ]

  注意事项：
  1. source和target必须是上述实体列表中的实体名称
  2. 只提取文本中明确表达的关系
  3. 关系类型要准确，选择最符合语义的类型
  4. 只返回JSON数组，不要包含任何其他说明文字

# 文档时间提取提示词模板
document_time_extraction_prompt: |
  请从文档名称中提取时间范围。

  文档名称：{doc_name}

  请提取时间范围，返回格式示例：
  - 2024年9月22日
  - 2024年9月
  - 2024年
  - 2024年第三季度
  - 2024年第四季度
  - 2024年上半年
  - 2025年1月至6月

  只返回时间字符串，不要有任何其他文字。如果没有时间信息，返回"未知"。

# 文本标签生成提示词模板
text_tag_generation_prompt: |
  请阅读以下文本块内容，给出简洁的标签描述。

  文本内容：
  {text}

  请用多句话描述这段文本主要讲了什么，包括：
  - 主要主题或事件
  - 关键发现或结论
  - 时间背景（如果有）
  
  格式示例：
  - "描述了2024年第三季度控烟政策的主要进展和挑战"
  - "分析了电子烟对青少年健康的影响及相关数据"
  - "总结了公共场所禁烟执法的难点和改进建议"
  
  只返回一句话标签，不要其他说明。

